<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages cannot set response headers, so policy is delivered via meta.
         'unsafe-inline' on style-src is required by the inline-style patterns this app
         uses; script-src stays strict (no inline, no eval) - verified: the built
         bundles contain no eval/Function constructor.
         GitHub Pages cannot set frame-ancestors response headers; that directive
         is deliberately omitted because a meta policy cannot enforce it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               font-src 'self' https://cdn.jsdelivr.net data:;
               img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com https://i1.sndcdn.com https://i.sndcdn.com;
               media-src 'self' blob:;
               connect-src 'self' blob: https://api.github.com;
               frame-src https://www.youtube-nocookie.com https://www.youtube.com https://w.soundcloud.com;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#090b10" />
    <title>Ryan Wetzstein | Selected work</title>
    <meta name="description" content="Ryan Wetzstein, computer science senior at NDSU building developer tools and AI systems, including Nexis, an open-source AI-native terminal." />
    <meta property="og:title" content="Ryan Wetzstein" />
    <meta property="og:description" content="Computer science senior at NDSU building developer tools and AI systems." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ryanwetzstein.com" />
    <link rel="canonical" href="https://ryanwetzstein.com/" />
    <!-- Crawlers don't resolve relative URLs, so the image must be absolute. -->
    <meta property="og:image" content="https://ryanwetzstein.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ryan Wetzstein, software developer and CS senior at NDSU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ryan Wetzstein" />
    <meta name="twitter:description" content="Computer science senior at NDSU building developer tools and AI systems." />
    <meta name="twitter:image" content="https://ryanwetzstein.com/og-image.png" />
  </head>

</html>
