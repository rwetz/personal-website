version: 2
# One grouped PR per ecosystem per week, so a weekly run opens a single PR per
# ecosystem instead of one per package. Security updates still arrive as their
# own PRs, outside this schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
